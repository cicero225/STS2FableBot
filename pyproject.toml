[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sts2bot"
version = "0.1.0"
description = "A bot that plays Slay the Spire 2 via the STS2MCP mod REST API"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]
llm = [
    "anthropic>=0.40",
]

[project.scripts]
sts2bot = "sts2bot.cli:app"

[tool.setuptools.packages.find]
include = ["sts2bot*"]

[tool.ruff]
line-length = 99
target-version = "py312"
# external/ and fork/ hold third-party clones (upstream style is not ours to lint)
extend-exclude = ["external", "fork"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
